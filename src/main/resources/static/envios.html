<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Envíos - AgroRuta</title>
    <link rel="icon" href="/img/logo.png" type="image/png">
    <link rel="preload" href="/fonts/fuente.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/sistema.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
          integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb"
          crossorigin="anonymous">
</head>
<body>
<div class="estructura">
    <nav id="menu"></nav>

    <main class="contenido">
        <header id="encabezado"></header>

        <div class="barra">
            <p class="suave barra__texto">Despacha pedidos, sigue el viaje en el mapa y registra la entrega para conocer tu ganancia real.</p>
            <button class="boton oculto" id="accion-principal" type="button">Despachar un pedido</button>
        </div>

        <div id="error" class="aviso aviso--error oculto" role="alert">
            <span id="error-texto"></span>
            <button class="boton boton-secundario" id="reintentar" type="button">Volver a cargar</button>
        </div>
        <div class="filtros" id="filtros" role="group" aria-label="Filtrar por estado"></div>
        <section class="tarjeta"><div id="barra-filtros"></div><div id="lista"></div></section>
    </main>
</div>
<script src="/js/api.js"></script>
<script src="/js/estructura.js"></script>
<script src="/js/ui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
        crossorigin="anonymous"></script>
<script src="/js/vendor/qrcode.js"></script>
<script src="/js/ruta-simulada.js"></script>
<script src="/js/envios.js"></script>
</body>
</html>
