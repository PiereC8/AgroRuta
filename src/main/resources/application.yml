spring:
  application:
    name: agroruta
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: America/Lima
  flyway:
    enabled: false

agroruta:
  bd:
    url: ${DB_PLATAFORMA_URL}
    usuario: ${DB_USUARIO}
    clave: ${DB_CLAVE}
    prefijo: agroruta_
    sufijo: ${BD_SUFIJO:_dev}
  jwt:
    secreto: ${JWT_SECRETO}
    horas-validez: 8
  administrador:
    usuario: ${ADMIN_PLATAFORMA_USUARIO:}
    clave: ${ADMIN_PLATAFORMA_CLAVE:}
  pagos:
    culqi:
      url-base: ${CULQI_URL_BASE:https://api.culqi.com/v2}
      llave-publica: ${CULQI_LLAVE_PUBLICA:}
      llave-secreta: ${CULQI_LLAVE_SECRETA:}
      rsa-id: ${CULQI_RSA_ID:}
      rsa-publica: ${CULQI_RSA_PUBLICA:}
  comprobantes:
    serie-boleta: ${COMPROBANTES_SERIE_BOLETA:B001}
    serie-factura: ${COMPROBANTES_SERIE_FACTURA:F001}
    nubefact:
      url: ${NUBEFACT_URL:}
      token: ${NUBEFACT_TOKEN:}
      autorizacion: ${NUBEFACT_AUTORIZACION:SOLO_TOKEN}

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: false
