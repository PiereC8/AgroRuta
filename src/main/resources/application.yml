spring:
  application:
    name: agroruta
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: America/Lima
  flyway:
    enabled: false

agroruta:
  cache:
    tarifas-segundos: ${CACHE_TARIFAS_SEGUNDOS:300}
  resiliencia:
    fallos-para-abrir: ${RESILIENCIA_FALLOS_PARA_ABRIR:5}
    pausa-segundos: ${RESILIENCIA_PAUSA_SEGUNDOS:30}
  bd:
    url: ${DB_PLATAFORMA_URL}
    usuario: ${DB_USUARIO}
    clave: ${DB_CLAVE}
    prefijo: agroruta_
    sufijo: ${BD_SUFIJO:_dev}
  jwt:
    secreto: ${JWT_SECRETO}
    horas-validez: 8
  administrador:
    usuario: ${ADMIN_PLATAFORMA_USUARIO:}
    clave: ${ADMIN_PLATAFORMA_CLAVE:}
  pagos:
    mercadopago:
      url-base: ${MERCADOPAGO_URL_BASE:https://api.mercadopago.com}
      llave-publica: ${MERCADOPAGO_LLAVE_PUBLICA:}
      token-acceso: ${MERCADOPAGO_TOKEN_ACCESO:}
  correo:
    servidor: ${CORREO_SERVIDOR:smtp.gmail.com}
    puerto: ${CORREO_PUERTO:587}
    usuario: ${CORREO_USUARIO:}
    clave: ${CORREO_CLAVE_APLICACION:}
    remitente: ${CORREO_REMITENTE:}
  avisos:
    merma-alta-porcentaje: ${AVISOS_MERMA_ALTA_PORCENTAJE:10}
    dias-cobro-vencido: ${AVISOS_DIAS_COBRO_VENCIDO:7}
    horas-comprobante-atascado: ${AVISOS_HORAS_COMPROBANTE_ATASCADO:24}
  comprobantes:
    serie-boleta: ${COMPROBANTES_SERIE_BOLETA:B001}
    serie-factura: ${COMPROBANTES_SERIE_FACTURA:F001}
    proveedor: ${COMPROBANTES_PROVEEDOR:simulado}
    facturaciondirecta:
      url-base: ${FACTURACIONDIRECTA_URL:https://facturaciondirecta.com/API_SUNAT}
    emisor:
      ruc: ${EMISOR_RUC:20000000001}
      razon-social: ${EMISOR_RAZON_SOCIAL:AGRORUTA DEMO}
      nombre-comercial: ${EMISOR_NOMBRE_COMERCIAL:AGRORUTA}
      domicilio-fiscal: ${EMISOR_DOMICILIO:AV. BOLOGNESI 100}
      ubigeo: ${EMISOR_UBIGEO:230101}
      distrito: ${EMISOR_DISTRITO:TACNA}
      provincia: ${EMISOR_PROVINCIA:TACNA}
      departamento: ${EMISOR_DEPARTAMENTO:TACNA}

server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    db:
      enabled: false
